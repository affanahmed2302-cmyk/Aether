services:
  node1:
    build: ..
    command: ["/aether-node", "-id", "node1", "-addr", ":7001", "-peers", "node2:7002,node3:7003"]
    ports:
      - "7001:7001"
  node2:
    build: ..
    command: ["/aether-node", "-id", "node2", "-addr", ":7002", "-peers", "node1:7001,node3:7003"]
    ports:
      - "7002:7002"
  node3:
    build: ..
    command: ["/aether-node", "-id", "node3", "-addr", ":7003", "-peers", "node1:7001,node2:7002"]
    ports:
      - "7003:7003"
